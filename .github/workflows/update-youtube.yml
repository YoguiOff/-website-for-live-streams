name: Actualizar vídeos de YouTube

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Leer últimas subidas del canal
        env:
          CHANNEL_ID: UCyNH6H2w3XIf728JV5AVUUg
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          channel_id = os.environ["CHANNEL_ID"]
          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
          request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              root = ET.fromstring(response.read())

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
              "media": "http://search.yahoo.com/mrss/"
          }
          videos = []
          for entry in root.findall("atom:entry", ns)[:3]:
              video_id = entry.findtext("yt:videoId", default="", namespaces=ns)
              title = entry.findtext("atom:title", default="Vídeo de YouTube", namespaces=ns)
              published = entry.findtext("atom:published", default="", namespaces=ns)
              if video_id:
                  videos.append({"id": video_id, "title": title, "published": published})

          os.makedirs("data", exist_ok=True)
          with open("youtube-videos.json", "w", encoding="utf-8") as file:
              json.dump({"videos": videos}, file, ensure_ascii=False, indent=2)
              file.write("\\n")
          print(f"Vídeos actualizados: {len(videos)}")
          PY

      - name: Guardar cambios si hay vídeos nuevos
        run: |
          if git diff --quiet -- youtube-videos.json; then
            echo "No hay vídeos nuevos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add youtube-videos.json
            git commit -m "Actualizar últimos vídeos de YouTube"
            git push
          fi
